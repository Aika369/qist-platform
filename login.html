<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — QIST</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%2316263d' stroke='%23b58a2e' stroke-width='6'/><text x='50' y='66' font-size='48' text-anchor='middle' fill='%23f4e9d2' font-family='Georgia'>Q</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-09-19b">
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="auth-wrap">
  <div class="card auth-card">
    <div class="tab-row">
      <button id="tab-login" class="active">Sign in</button>
      <button id="tab-register">Create account</button>
    </div>
    <div id="auth-alert"></div>

    <form id="login-form">
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="l-email" required style="width:100%" placeholder="you@university.edu">
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" id="l-password" required style="width:100%">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>

    </form>

    <form id="register-form" style="display:none">
      <div class="form-row">
        <label>Full name</label>
        <input type="text" id="r-name" required style="width:100%" placeholder="Aigerim Bekova">
      </div>
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="r-email" required style="width:100%" placeholder="you@university.edu">
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" id="r-password" required minlength="8" style="width:100%" placeholder="At least 8 characters">
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>Position / title</label>
          <input type="text" id="r-title" style="width:100%" placeholder="PhD Student">
        </div>
        <div class="form-row">
          <label>Institution</label>
          <input type="text" id="r-inst" style="width:100%" placeholder="Nazarbayev University">
        </div>
      </div>
      <div class="form-row">
        <label>Research topics (comma-separated)</label>
        <input type="text" id="r-topics" style="width:100%" placeholder="machine learning, optimization">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Create account</button>
      <p class="small muted" style="margin-top:12px">By joining you agree to be listed in the QIST member directory.</p>
    </form>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/app.js?v=2026-09-19b"></script>
<script>
(async () => {
  await QIST.boot('login.html');
  const $ = id => document.getElementById(id);
  const next = new URLSearchParams(location.search).get('next') || 'index.html';

  // Accounts live on the server only. Until it is deployed we do not pretend registration
  // works: it used to write the account into the visitor's own localStorage.
  if (!QIST.authAvailable()) {
    /* No server, so there is no account to create — but "Create profile" in the header must
       still do what it says. It now collects a real request that reaches us by email, and a
       curator creates the profile by hand until the backend is deployed (DECISIONS.md D-29).
       No password field: asking for a password we have nowhere to store would be worse than
       the dead end it replaces. */
    document.querySelector('.auth-wrap').innerHTML = `
      <div class="card auth-card org-form" style="padding:30px 32px;text-align:left">
        <h2 style="margin-bottom:8px">Create your profile</h2>
        <p class="small muted" style="margin-bottom:16px">
          Sign-in accounts arrive with the server. Until then a curator creates profiles by hand —
          send this and we will write back from ${QIST.esc(QIST.CONTACT_EMAIL || 'the QIST team')}.
          We do not ask for a password, because we have nowhere to keep it yet.
        </p>
        <form id="req-form" style="display:flex;flex-direction:column;gap:13px">
          <label>Full name<input type="text" id="q-name" required placeholder="Aigerim Bekova"></label>
          <label>Email<input type="email" id="q-email" required placeholder="you@university.edu"></label>
          <div class="org-row-2">
            <label>Position / title<input type="text" id="q-title" placeholder="PhD Student"></label>
            <label>Institution<input type="text" id="q-inst" placeholder="Nazarbayev University"></label>
          </div>
          <label>Country<select id="q-country"></select></label>
          <label>Research topics, comma separated<input type="text" id="q-topics" placeholder="machine learning, optimization"></label>
          <label>Link to a public profile — ORCID, Scholar, your university page
            <input type="text" id="q-link" placeholder="https://orcid.org/…">
          </label>
          <p class="org-note">
            We publish name, title, organisation, country, research fields and that public link.
            <b>Email addresses are never published in the directory.</b> You can ask us to change or
            delete the profile at any time, with no justification — see <a href="about.html#data">About QIST</a>.
          </p>
          <button class="btn btn-primary" type="submit" id="q-send">Send the request</button>
          <span class="small muted" id="q-state"></span>
        </form>
        <p class="small muted" style="margin-top:16px">
          From a university or a company? <a href="organizations.html">For organizations</a> has the
          form for posting work, not a personal profile.
        </p>
      </div>`;

    const s = id => document.getElementById(id);
    try { QIST.fillCountrySelect(s('q-country'), await QIST.getEligibility(), 'KZ'); } catch (_) {}

    s('req-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = s('q-send'), state = s('q-state');
      btn.disabled = true; btn.textContent = 'Sending…';
      const res = await QIST.submitForm(QIST.SIGNUP_ENDPOINT, {
        _subject: 'Profile request: ' + s('q-name').value.trim(),
        kind: 'profile_request',
        name: s('q-name').value.trim(), email: s('q-email').value.trim(),
        title: s('q-title').value.trim(), institution: s('q-inst').value.trim(),
        country: s('q-country').value,
        topics: s('q-topics').value.split(',').map(x => x.trim()).filter(Boolean).join(', '),
        public_link: s('q-link').value.trim(),
        at: new Date().toISOString()
      });
      if (res.ok) {
        btn.textContent = '✓ Sent';
        state.textContent = 'We will write back within a few working days.';
        s('req-form').reset();
      } else {
        btn.disabled = false; btn.textContent = 'Send the request';
        state.textContent = res.reason === 'not_configured'
          ? 'Submissions are not wired up yet: set QIST.SIGNUP_ENDPOINT in assets/js/app.js.'
          : 'Could not send that. Try again, or write to ' + (QIST.CONTACT_EMAIL || 'the QIST team') + '.';
      }
    });
    return;
  }

  function show(which) {
    $('login-form').style.display = which === 'login' ? '' : 'none';
    $('register-form').style.display = which === 'register' ? '' : 'none';
    $('tab-login').classList.toggle('active', which === 'login');
    $('tab-register').classList.toggle('active', which === 'register');
    $('auth-alert').innerHTML = '';
  }
  $('tab-login').addEventListener('click', () => show('login'));
  $('tab-register').addEventListener('click', () => show('register'));
  if (location.hash === '#register') show('register');

  function err(msg) { $('auth-alert').innerHTML = `<div class="alert alert-error">${QIST.esc(msg)}</div>`; }

  $('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await QIST.login($('l-email').value.trim(), $('l-password').value);
      location.href = next;
    } catch (ex) { err(ex.message); }
  });

  $('register-form').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const topics = $('r-topics').value.split(',').map(s => s.trim()).filter(Boolean);
      await QIST.register({
        name: $('r-name').value.trim(),
        email: $('r-email').value.trim(),
        password: $('r-password').value,
        title: $('r-title').value.trim(),
        institution: $('r-inst').value.trim(),
        topics
      });
      location.href = next;
    } catch (ex) { err(ex.message); }
  });
})();
</script>
</body>
</html>
