<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScienceBridge AI by QIST</title>
<meta name="description" content="Find researchers from Central Asia, the Caucasus and Mongolia, and check your eligibility for international grants and positions.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-09-28c">
</head>
<body>
<header class="site-header" id="site-header"></header>

<!-- ================= hero =================
     Two jobs, one per tab. "Find a call" is first because the first user in PRD.md is a
     researcher, and the eligibility check is the thing no other site does: the reader states
     their stage and country and gets a count of calls they can enter, not a list to read. -->
<section class="hero girih-edge">
  <div class="container">
    <div class="hero-copy">
      <h1 data-i18n-html="home.h1"></h1>
      <p class="lead" data-i18n="home.lead"></p>

      <div class="hero-tabs" role="tablist" data-i18n-attr="aria-label:home.h1">
        <button type="button" role="tab" id="tab-call" aria-controls="panel-call" aria-selected="true" data-i18n="home.tab.call"></button>
        <button type="button" role="tab" id="tab-people" aria-controls="panel-people" aria-selected="false" data-i18n="home.tab.people"></button>
      </div>

      <div class="hero-panel on-navy" id="panel-call" role="tabpanel" aria-labelledby="tab-call">
        <p class="sentence">
          <span data-i18n="home.s.a"></span>
          <select id="demo-stage" data-i18n-attr="aria-label:opp.mystage">
            <option value="any" data-i18n="opp.stage.any"></option>
            <option value="phd_student" data-i18n="opp.stage.phd_student"></option>
            <option value="phd_plus" selected data-i18n="opp.stage.phd_plus"></option>
            <option value="postdoc_plus" data-i18n="opp.stage.postdoc_plus"></option>
            <option value="pi_only" data-i18n="opp.stage.pi_only"></option>
          </select><span data-i18n="home.s.b"></span><select id="demo-country" data-i18n-attr="aria-label:opp.mycountry"></select>
        </p>
        <p class="hero-result" id="hero-result" aria-live="polite"></p>
        <div class="tiles" id="hero-tiles" aria-hidden="true"></div>
        <div class="hero-actions">
          <a class="btn btn-gold btn-lg" id="hero-show" href="opportunities.html" data-i18n="home.s.show"></a>
          <a class="link" href="opportunities.html" data-i18n="home.s.all"></a>
        </div>
      </div>

      <div class="hero-panel" id="panel-people" role="tabpanel" aria-labelledby="tab-people" hidden>
        <form class="hero-search" id="hero-search" role="search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <label class="sr-only" for="hero-query" data-i18n="home.search.ph"></label>
          <input id="hero-query" name="q" type="text" data-i18n-attr="placeholder:home.search.ph" autocomplete="off">
          <button type="submit" data-i18n="common.search"></button>
        </form>
        <div class="hero-suggestions">
          <span data-i18n="home.suggested"></span>
          <button type="button" data-query="Oil &amp; gas" data-i18n="home.chip.oil"></button>
          <button type="button" data-query="Mining metallurgy" data-i18n="home.chip.mining"></button>
          <button type="button" data-query="Energy transition" data-i18n="home.chip.energy"></button>
          <button type="button" data-query="Biomedical engineering" data-i18n="home.chip.biomed"></button>
          <button type="button" data-query="Artificial intelligence" data-i18n="home.chip.ai"></button>
          <button type="button" data-query="Medicine" data-i18n="home.chip.med"></button>
          <button type="button" data-query="Logistics supply chain" data-i18n="home.chip.log"></button>
        </div>
      </div>

      <p class="hero-facts" id="hero-facts"></p>
    </div>

  </div>
</section>

<!-- ================= three calls, checked =================
     The same condition chips as the Opportunities page, driven by the profile in the hero.
     Which three: D-39, so each shows a different edge of the check. -->
<section class="section">
  <div class="container">
    <div class="sec-head">
      <h2 data-i18n="home.calls.h2"></h2>
      <a href="opportunities.html" id="calls-all"><span data-i18n="home.demo.all"></span></a>
      <p class="legend" aria-hidden="true">
        <span class="cond ok" data-i18n="legend.ok"></span>
        <span class="cond bad" data-i18n="legend.bad"></span>
        <span class="cond unk" data-i18n="legend.unk"></span>
      </p>
    </div>
    <div class="rows" id="demo-list"></div>
  </div>
</section>

<!-- ================= the network by field =================
     The globe shows where members work (real coordinates, D-12 markers for country-level
     records). Beside it, depth by field, no names (D-34); each row opens the directory. -->
<section class="network girih-edge">
  <div class="container">
    <div class="sec-head">
      <h2 data-i18n="home.depth.h2"></h2>
      <a href="directory.html" data-i18n="home.depth.open"></a>
      <p class="lede" data-i18n="home.depth.lede"></p>
    </div>
    <div class="network-grid">
      <div class="science-globe" id="globe-view">
        <div class="globe-stage">
          <canvas id="globe" role="img" aria-label="ScienceBridge AI"></canvas>
          <div class="globe-tip" id="globe-tip"></div>
        </div>
        <p class="globe-hint" data-i18n="home.globe.hint"></p>
      </div>
      <div id="depth" class="depth"></div>
    </div>
  </div>
</section>

<!-- ================= for organizations ================= -->
<section class="section">
  <div class="container photo-split">
    <figure class="photo">
      <img src="assets/img/lab-astana.jpg" alt="" loading="lazy" width="1600" height="1062">
    </figure>
    <div>
      <div class="sec-head" style="margin-bottom:12px">
        <h2 data-i18n="home.door2.h"></h2>
        <p class="lede" data-i18n="org.sub.company"></p>
      </div>
      <ul class="org-list">
        <li><a href="organizations.html#find"><b data-i18n="org.find.h2"></b><span data-i18n="home.door2.c"></span><i aria-hidden="true">→</i></a></li>
        <li><a href="organizations.html#post"><b data-i18n="org.post.h2"></b><span data-i18n="home.door2.a"></span><i aria-hidden="true">→</i></a></li>
        <li><a href="organizations.html#talk"><b data-i18n="org.talk.h2"></b><span data-i18n="org.talk.lede.company"></span><i aria-hidden="true">→</i></a></li>
      </ul>
    </div>
  </div>
</section>



<section class="section" style="padding-bottom:0">
  <div class="container">
    <div class="digest" id="pilot">
      <div>
        <h2 data-i18n="home.cta.h"></h2>
        <p data-i18n="home.cta.p"></p>
      </div>
      <div>
        <form id="cta-subscribe">
          <label class="sr-only" for="cta-email" data-i18n="common.email"></label>
          <input type="email" required data-i18n-attr="placeholder:home.cta.ph" id="cta-email">
          <button class="btn btn-primary" type="submit" data-i18n="home.cta.btn"></button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-09-28c"></script>
<script src="assets/js/app.js?v=2026-09-28c"></script>
<script src="assets/js/globe.js?v=2026-09-28c"></script>
<script>
(async () => {
  await QIST.boot('index.html');
  const $ = id => document.getElementById(id);

  const [allPeople, opps] = await Promise.all([QIST.getPeople(), QIST.getOpportunities()]);
  const people = QIST.uniquePeople(allPeople);

  // the globe: fails quietly so a bad fetch never takes the section down
  let globe = null;
  try {
    const landDots = await fetch('assets/data/land-dots.json').then(r => r.json());
    globe = QistGlobe.mount($('globe'), {
      people, landDots, tooltip: $('globe-tip'), hubs: 12,
      labels: { count: n => QIST.t('globe.count', { n }), nocity: QIST.t('globe.nocity'), unknown: QIST.t('globe.unknown') }
    });
  } catch (err) {
    console.error('Globe failed to load:', err);
    document.querySelector('.science-globe').style.display = 'none';
  }

  /* Counters computed from the data (D-31). Flagged duplicates are not counted (D-14), and
     only calls with an open deadline count as open. */
  const active = opps.filter(o => !QIST.isExpired(o));
  const countries = new Set(people.map(p => p.country).filter(Boolean)).size;
  $('hero-facts').innerHTML = QIST.t('home.facts', { people: people.length, countries, opps: active.length });

  /* ---------- tabs ---------- */
  const tabs = [['tab-call', 'panel-call'], ['tab-people', 'panel-people']];
  function selectTab(id) {
    tabs.forEach(([t, p]) => {
      $(t).setAttribute('aria-selected', String(t === id));
      $(p).hidden = t !== id;
    });
  }
  tabs.forEach(([t]) => $(t).addEventListener('click', () => selectTab(t)));
  document.querySelector('.hero-tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const next = document.activeElement.id === 'tab-call' ? 'tab-people' : 'tab-call';
    selectTab(next); $(next).focus();
  });

  /* ---------- the check ---------- */
  const elig = await QIST.getEligibility();
  const demoCountry = $('demo-country'), demoStage = $('demo-stage');
  QIST.fillCountrySelect(demoCountry, elig, 'KZ');

  /* Which three calls to show (D-39): the soonest overall, then the soonest whose verdict
     depends on the country, then the soonest with a career-stage bar. Sorting purely by
     deadline gave three calls open to any nationality, and the check showed nothing. */
  const byDeadline = [...active].sort((a, b) => {
    if (!a.deadline) return 1; if (!b.deadline) return -1;
    return a.deadline.localeCompare(b.deadline);
  });
  const countrySensitive = o => {
    const e = o.eligibility || {};
    return (e.programme && e.programme !== 'open') ||
           (e.countries_allowed || []).length > 0 || (e.countries_excluded || []).length > 0;
  };
  const three = [];
  const take = pred => { const o = byDeadline.find(x => pred(x) && !three.includes(x)); if (o) three.push(o); };
  take(() => true);
  take(countrySensitive);
  take(o => o.career_stage && o.career_stage !== 'any');
  while (three.length < 3 && three.length < byDeadline.length) take(() => true);
  three.sort((a, b) => (a.deadline || '9').localeCompare(b.deadline || '9'));

  function draw() {
    const profile = { country: demoCountry.value, stage: demoStage.value, fields: [], methods: [] };
    const q = `country=${encodeURIComponent(profile.country)}&stage=${encodeURIComponent(profile.stage)}`;

    const fit = active.filter(o => !QIST.matchOpportunity(o, profile, elig).blocked).length;
    const result = $('hero-result');
    const was = result.dataset.fit === undefined ? fit : Number(result.dataset.fit);
    result.dataset.fit = fit;
    result.innerHTML = fit
      ? QIST.t('home.s.result', { fit: `<b>${was}</b>`, open: active.length })
      : QIST.t('home.s.none', { open: active.length });
    if (fit) QIST.tweenNumber(result.querySelector('b'), was, fit);

    /* One tile per open call, closing soonest first: lit if the profile qualifies. When the
       country changes, the tiles that go out are the calls it rules out. */
    const tiles = $('hero-tiles');
    if (!tiles.children.length) {
      tiles.innerHTML = byDeadline.map(o =>
        `<a class="tile" href="opportunities.html#opp-${encodeURIComponent(o.id)}" title="${QIST.esc(o.title)}" tabindex="-1"></a>`).join('');
    }
    [...tiles.children].forEach((el, i) => {
      const o = byDeadline[i];
      el.classList.toggle('on', !QIST.matchOpportunity(o, profile, elig).blocked);
      el.href = `opportunities.html?${q}#opp-${encodeURIComponent(o.id)}`;
      el.style.transitionDelay = QIST.reducedMotion() ? '0ms' : `${i * 18}ms`;
    });
    $('hero-show').href = `opportunities.html?${q}&elig=1`;
    $('calls-all').href = `opportunities.html?${q}`;

    QIST.flashChanges($('demo-list'), () => { $('demo-list').innerHTML = three.length ? three.map(o => {
      const m = QIST.matchOpportunity(o, profile, elig);
      return `<article class="opp compact opp-${m.tone}" data-opp="${QIST.esc(o.id)}">
        ${QIST.whenCell(o)}
        <div class="opp-main">
          <p class="opp-line"><span class="opp-type">${QIST.esc(QIST.typeLabel(o.type))}</span><span>${QIST.esc(o.organization)}</span></p>
          <h3><a href="opportunities.html?${q}#opp-${encodeURIComponent(o.id)}">${QIST.esc(o.title)}</a></h3>
          ${QIST.condChips(m, profile, elig)}
        </div>
      </article>`;
    }).join('') : `<p class="empty">${QIST.t('home.demo.empty')}</p>`; });
  }
  [demoCountry, demoStage].forEach(el => el.addEventListener('change', () => { QIST.fitSelect(el); draw(); }));
  [demoCountry, demoStage].forEach(el => QIST.fitSelect(el));
  draw();

  /* ---------- depth of the network, by field, no names ---------- */
  const counts = QIST.fieldCounts(people);
  const top = Object.entries(counts)
    .filter(([f]) => f !== 'Other Research Area')
    .sort((a, b) => b[1] - a[1]).slice(0, 10);
  const max = top.length ? top[0][1] : 1;
  $('depth').innerHTML = top.map(([f, n]) => `
    <a class="depth-row" href="directory.html?field=${encodeURIComponent(f)}">
      <span class="depth-label">${QIST.esc(f)}</span>
      <span class="depth-bar"><i style="width:${Math.round((n / max) * 100)}%"></i></span>
      <span class="depth-n">${n}</span>
    </a>`).join('') +
    `<p class="depth-note">${QIST.t('home.depth.note', { countries, people: people.length })}</p>`;

  /* Hover or focus a field and the globe shows where those members are; the line under the
     globe names the field and the count. */
  const hint = document.querySelector('.globe-hint');
  const hintText = hint ? hint.textContent : '';
  /* The globe only holds members with coordinates, so the line says how many of the
     field's members it shows rather than implying it shows all of them. */
  const showField = f => {
    if (!globe || !globe.highlight) return;
    const n = globe.highlight(f ? (p => QIST.primaryFields(p).includes(f)) : null);
    if (hint) hint.innerHTML = f
      ? QIST.t('home.globe.field', { field: QIST.esc(f), n: `<b>${n}</b>`, total: counts[f] || n })
      : QIST.esc(hintText);
  };
  document.querySelectorAll('#depth .depth-row').forEach(row => {
    const f = decodeURIComponent(row.getAttribute('href').split('field=')[1] || '');
    row.addEventListener('mouseenter', () => showField(f));
    row.addEventListener('focus', () => showField(f));
    row.addEventListener('mouseleave', () => showField(null));
    row.addEventListener('blur', () => showField(null));
  });

  /* ---------- digest sign-up ----------
     Posts to the configured endpoint; with none configured the form says so instead of
     pretending (it used to save the address into the visitor's own localStorage). */
  const form = $('cta-subscribe'), emailInput = $('cta-email'), btn = form.querySelector('button');
  if (!QIST.SIGNUP_ENDPOINT) {
    emailInput.disabled = true; btn.disabled = true;
    form.insertAdjacentHTML('afterend', `<p class="off">${QIST.t('home.cta.off')}</p>`);
  } else {
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;
      btn.disabled = true; btn.textContent = QIST.t('common.sending');
      const res = await QIST.submitForm(QIST.SIGNUP_ENDPOINT, {
        _subject: 'ScienceBridge pilot sign-up', kind: 'pilot_signup', email, at: new Date().toISOString()
      });
      if (res.ok) {
        form.innerHTML = `<p>${QIST.t('home.cta.ok')}</p>`;
      } else {
        btn.disabled = false; btn.textContent = QIST.t('home.cta.btn');
        QIST.toast(QIST.t('opp.toast.fail'));
      }
    });
  }

  /* ---------- find a researcher ---------- */
  const openDirectorySearch = query => {
    const value = String(query || '').trim();
    location.href = 'directory.html' + (value ? '?q=' + encodeURIComponent(value) : '');
  };
  $('hero-search').addEventListener('submit', e => { e.preventDefault(); openDirectorySearch($('hero-query').value); });
  document.querySelectorAll('.hero-suggestions [data-query]').forEach(b =>
    b.addEventListener('click', () => openDirectorySearch(b.dataset.query)));
})();
</script>
</body>
</html>
