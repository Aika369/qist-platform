<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="opp.h2">Opportunities — ScienceBridge AI by QIST</title>
<meta name="description" content="Grants, consortium roles, academic and industry positions and co-author calls — each with an explicit eligibility verdict for your country, checked against the published source.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%2316263d' stroke='%23b58a2e' stroke-width='6'/><text x='50' y='66' font-size='48' text-anchor='middle' fill='%23f4e9d2' font-family='Georgia'>Q</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-09-20a">
</head>
<body>
<header class="site-header" id="site-header"></header>

<div class="container" style="padding-top:26px">

  <div class="section-head">
    <div>
      <h2 class="rule" data-i18n="opp.h2">Opportunities</h2>
      <p class="small muted" style="margin-top:6px;max-width:62ch" data-i18n="opp.lede"></p>
    </div>
  </div>

  <!-- reader profile: the verdicts depend on it -->
  <div class="opp-profile">
    <div>
      <label for="of-country" data-i18n="opp.mycountry">My country</label>
      <select id="of-country" data-i18n-attr="aria-label:opp.mycountry"></select>
    </div>
    <div>
      <label for="of-stage" data-i18n="opp.mystage">My career stage</label>
      <select id="of-stage">
        <option value="any" data-i18n="opp.stage.any">Student / Master's</option>
        <option value="phd_student" data-i18n="opp.stage.phd_student">PhD candidate</option>
        <option value="phd_plus" selected data-i18n="opp.stage.phd_plus">PhD / Researcher</option>
        <option value="postdoc_plus" data-i18n="opp.stage.postdoc_plus">Postdoc</option>
        <option value="pi_only" data-i18n="opp.stage.pi_only">Professor / PI</option>
      </select>
    </div>
    <div>
      <label for="of-myfield" data-i18n="opp.myfield">My research field</label>
      <select id="of-myfield" data-i18n-attr="aria-label:opp.myfield"></select>
    </div>
    <p class="opp-profile-note" data-i18n="opp.profile.note"></p>
  </div>

  <!-- filters -->
  <div class="filters" id="opp-filters">
    <input type="text" id="of-q" class="search-input" data-i18n-attr="placeholder:opp.search.ph">
    <select id="of-type"><option value="" data-i18n="opp.alltypes">All types</option></select>
    <select id="of-field"><option value="" data-i18n="common.allfields">All research fields</option></select>
    <label class="opp-check"><input type="checkbox" id="of-elig"> <span data-i18n="opp.onlyelig">Only what I am eligible for</span></label>
    <label class="opp-check"><input type="checkbox" id="of-open" checked> <span data-i18n="opp.hideexpired">Hide expired</span></label>
  </div>

  <p class="small muted" id="opp-count" style="margin-bottom:14px" data-i18n="common.loading">Loading…</p>

  <div id="opp-list"></div>

</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-09-20a"></script>
<script src="assets/js/app.js?v=2026-09-20a"></script>
<script>
(async () => {
  await QIST.boot('opportunities.html');

  const $ = id => document.getElementById(id);
  const list = $('opp-list'), count = $('opp-count');

  /* Deploy guard. This page needs helpers and data files that ship together with it.
     When only part of a release reaches the server, a missing helper used to throw and
     leave a blank page with no explanation. Now we say what is out of date. */
  function outOfDate(what) {
    count.textContent = '';
    list.innerHTML = `<div class="card pad-lg opp-empty">
      <h3>${QIST.t('opp.stale.h')}</h3>
      <p class="small muted">Missing or outdated: <code>${QIST.esc(what)}</code>.
        Upload the whole release together — <code>assets/js/app.js</code>,
        <code>data/eligibility.json</code> and <code>data/opportunities.json</code> must match this page.</p>
      <p class="small muted">This page expects build <code>2026-09-20a</code>; the server has
        <code>${QIST.esc(QIST.BUILD || 'older than 2026-09-20a')}</code>.</p>
    </div>`;
  }
  if (typeof QIST.fillCountrySelect !== 'function' || !QIST.PRIMARY_FIELDS
      || typeof QIST.fieldsMatch !== 'function' || typeof QIST.oppFieldCounts !== 'function'
      || typeof QIST.matchOpportunity !== 'function') {
    console.error('opportunities.html: assets/js/app.js is older than this page');
    return outOfDate('assets/js/app.js');
  }

  /* ---------- data loading: explicit loading and error states ---------- */
  let opps, elig;
  try {
    [opps, elig] = await Promise.all([QIST.getOpportunities(), QIST.getEligibility()]);
  } catch (err) {
    console.error('Failed to load opportunities:', err);
    count.textContent = '';
    list.innerHTML = `<div class="card pad-lg opp-empty">
      <h3>${QIST.t('opp.err.h')}</h3>
      <p class="small muted">${QIST.t('opp.err.p')}</p>
      <button class="btn btn-outline" onclick="location.reload()">${QIST.t('common.reload')}</button></div>`;
    return;
  }

  /* ---------- populate the lookups ---------- */
  if (!elig.priority_countries || Object.keys(elig.countries || {}).length < 50) {
    console.error('opportunities.html: data/eligibility.json is older than this page');
    return outOfDate('data/eligibility.json');
  }
  QIST.fillCountrySelect($('of-country'), elig, 'KZ');

  const usedTypes = [...new Set(opps.map(o => o.type))];
  usedTypes.forEach(t => $('of-type').insertAdjacentHTML('beforeend',
    `<option value="${t}">${QIST.esc(QIST.OPPORTUNITY_TYPES[t] || t)}</option>`));

  /* All 35 QIST primary research fields, always in the same order, so the filter looks
     the same on every visit. Fields with nothing behind them are shown disabled with an
     em-dash rather than hidden: that makes the gaps in our coverage visible. */
  const fieldCounts = QIST.oppFieldCounts(opps);
  QIST.PRIMARY_FIELDS.forEach(f => {
    const n = fieldCounts[f] || 0;
    $('of-field').insertAdjacentHTML('beforeend',
      `<option value="${QIST.esc(f)}"${n ? '' : ' disabled'}>${QIST.esc(f)}${n ? ` (${n})` : ' —'}</option>`);
  });

  /* The reader's own field, used by the match analysis rather than by the filter. Kept
     separate on purpose: "show me AI calls" and "I am an AI researcher" are different questions. */
  $('of-myfield').insertAdjacentHTML('beforeend', `<option value="">${QIST.t('common.notset')}</option>`);
  QIST.PRIMARY_FIELDS.forEach(f =>
    $('of-myfield').insertAdjacentHTML('beforeend', `<option value="${QIST.esc(f)}">${QIST.esc(f)}</option>`));

  /* ---------- state lives in the URL ---------- */
  const IDS = { country:'of-country', stage:'of-stage', myfield:'of-myfield', q:'of-q', type:'of-type', field:'of-field' };
  function readUrl() {
    const p = new URLSearchParams(location.search);
    Object.entries(IDS).forEach(([k, id]) => { if (p.has(k)) $(id).value = p.get(k); });
    if (p.has('elig')) $('of-elig').checked = p.get('elig') === '1';
    if (p.has('open')) $('of-open').checked = p.get('open') === '1';
  }
  function writeUrl() {
    const p = new URLSearchParams();
    Object.entries(IDS).forEach(([k, id]) => { if ($(id).value) p.set(k, $(id).value); });
    if ($('of-elig').checked) p.set('elig', '1');
    if (!$('of-open').checked) p.set('open', '0');
    history.replaceState(null, '', p.toString() ? '?' + p : location.pathname);
  }
  readUrl();

  /* ---------- rendering ---------- */
  /* The reader's profile, as chosen on this page. It is what the match analysis is computed
     against; nothing is stored, and it all lives in the URL so the page can be shared. */
  function readerProfile() {
    const f = $('of-myfield').value;
    return { country: $('of-country').value, stage: $('of-stage').value, fields: f ? [f] : [], methods: [] };
  }

  function card(o, profile) {
    const m = QIST.matchOpportunity(o, profile, elig);
    const expired = QIST.isExpired(o);
    const left = QIST.daysLeft(o);

    const deadline = !o.deadline
      ? `<span class="muted">${QIST.t('opp.nodeadline')}</span>`
      : expired
        ? `<span class="opp-expired">${QIST.t('opp.expired', { date: QIST.esc(o.deadline) })}</span>`
        : `${QIST.t('opp.deadline.in')} <b class="deadline">${QIST.t('opp.deadline.days', { n: left })}</b>`;

    /* One row per requirement the call actually states, each with the reason and, where the
       verdict came from a published list, the link it came from. */
    const rows = m.criteria.map(x => {
      const mark = x.unknown ? '?' : x.ok ? '✓' : '✗';
      const cls  = x.unknown ? 'unk' : x.ok ? 'ok' : 'bad';
      const src  = x.source
        ? ` <a class="opp-src-inline" href="${QIST.esc(x.source.url)}" target="_blank" rel="noopener">${QIST.t('elig.source')}${x.source.version ? ' ' + QIST.esc(x.source.version) : ''}${x.source.date ? ', ' + QIST.esc(x.source.date) : ''} →</a>`
        : '';
      return `<div class="opp-elig-row">
        <span class="k">${QIST.esc(x.label)}${x.blocking ? '' : ` <i>${QIST.t('match.soft')}</i>`}</span>
        <span class="v">${QIST.esc(x.detail)}${src}</span>
        <span class="verdict v-${cls}">${mark}</span>
      </div>`;
    }).join('');

    const note = o.eligibility && o.eligibility.note
      ? `<div class="opp-src">${QIST.t('opp.fundercond', { note: QIST.esc(o.eligibility.note) })}</div>` : '';

    return `<article class="card opp-card${expired ? ' is-expired' : ''}" id="opp-${QIST.esc(o.id)}">
      <div class="opp-head">
        <span class="opp-type">${QIST.esc(QIST.OPPORTUNITY_TYPES[o.type] || o.type)}</span>
        <h3>${QIST.esc(o.title)}</h3>
      </div>
      <div class="opp-meta">
        <span>${QIST.esc(o.organization)}</span>
        ${o.city ? `<span>📍 ${QIST.esc(o.city)}</span>` : ''}
        <span>${deadline}</span>
        <span class="opp-fund opp-fund-${QIST.esc(o.funding_status)}">${QIST.esc(QIST.FUNDING_LABELS[o.funding_status] || o.funding_status)}</span>
      </div>
      <p class="opp-sum">${QIST.esc(o.summary)}</p>

      <div class="match match-${m.tone}">
        <div class="match-head">
          <div class="match-score">
            <b>${m.met}<span>/${m.total}</span></b>
            <span class="match-pct">${m.pct}%</span>
          </div>
          <div class="match-bar" role="img" aria-label="${QIST.esc(QIST.t('match.aria', { met: m.met, total: m.total }))}">
            <i style="width:${m.pct}%"></i>
          </div>
          <p class="match-verdict">${QIST.esc(m.verdict)}</p>
        </div>
        <details class="match-why"${m.blocked ? ' open' : ''}>
          <summary>${QIST.t('match.why')}</summary>
          <div class="opp-elig">
            ${rows}
            ${note}
            <p class="match-caveat">${QIST.t('match.caveat')}</p>
            <p class="match-caveat" style="border:0;padding-top:0">${QIST.t('opp.sourcelang')}</p>
          </div>
        </details>
      </div>

      ${o.role_expected ? `<p class="opp-role"><span>${QIST.t('opp.role')}</span> ${QIST.esc(o.role_expected)}${o.workload ? ' · ' + QIST.esc(o.workload) : ''}</p>` : ''}
      ${o.all_fields
          ? `<div class="tags"><span class="tag tag-all">${QIST.t('opp.allfieldstag')}</span></div>`
          : ((o.fields || []).length ? `<div class="tags">${o.fields.map(f => `<span class="tag">${QIST.esc(f)}</span>`).join('')}</div>` : '')}

      <div class="opp-actions">
        <button class="btn btn-primary" data-interest="${QIST.esc(o.id)}"${expired ? ' disabled' : ''}>${QIST.t('opp.interested')}</button>
        ${o.source_url ? `<a class="btn btn-outline" href="${QIST.esc(o.source_url)}" target="_blank" rel="noopener">${QIST.t('opp.source')}</a>` : ''}
        <button class="btn btn-ghost" data-dismiss="${QIST.esc(o.id)}">${QIST.t('opp.dismiss')}</button>
      </div>
    </article>`;
  }

  const dismissed = new Set();

  function render() {
    writeUrl();
    const profile = readerProfile();
    const q = $('of-q').value.trim().toLowerCase();
    const type = $('of-type').value, field = $('of-field').value;
    const onlyElig = $('of-elig').checked, hideExpired = $('of-open').checked;

    const shown = opps.filter(o => {
      if (dismissed.has(o.id)) return false;
      if (type && o.type !== type) return false;
      if (field && !QIST.fieldsMatch(o, field)) return false;
      if (hideExpired && QIST.isExpired(o)) return false;
      // "Only what I am eligible for" hides anything with a blocking failure — country,
      // career stage or a deadline that has already passed.
      if (onlyElig && QIST.matchOpportunity(o, profile, elig).blocked) return false;
      if (q) {
        const hay = `${o.title} ${o.organization} ${o.summary} ${(o.fields || []).join(' ')} ${(o.methods_required || []).join(' ')}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    count.innerHTML = shown.length
      ? QIST.t('opp.count', { shown: `<b>${shown.length}</b>`, total: opps.length })
      : '';

    list.innerHTML = shown.length
      ? shown.map(o => card(o, profile)).join('')
      : `<div class="card pad-lg opp-empty">
           <h3>${QIST.t('opp.empty.h')}</h3>
           <p class="small muted">${QIST.t('opp.empty.p', { n: opps.length })}</p>
           <button class="btn btn-outline" id="opp-reset">${QIST.t('common.clear')}</button>
         </div>`;

    const reset = $('opp-reset');
    if (reset) reset.addEventListener('click', () => {
      $('of-q').value = ''; $('of-type').value = ''; $('of-field').value = '';
      $('of-elig').checked = false; $('of-open').checked = true;
      render();
    });
  }

  /* ---------- actions ---------- */
  list.addEventListener('click', async (e) => {
    const dis = e.target.closest('[data-dismiss]');
    if (dis) { dismissed.add(dis.dataset.dismiss); render(); QIST.toast(QIST.t('opp.toast.dismiss')); return; }

    const btn = e.target.closest('[data-interest]');
    if (!btn) return;
    const o = opps.find(x => x.id === btn.dataset.interest);
    btn.disabled = true; btn.textContent = QIST.t('common.sending');
    const res = await QIST.recordInterest(o, { country: $('of-country').value, stage: $('of-stage').value });
    if (res.ok) {
      btn.textContent = QIST.t('opp.interested.ok');
      QIST.toast(QIST.t('opp.toast.sent'));
    } else if (res.reason === 'not_configured') {
      btn.disabled = false; btn.textContent = QIST.t('opp.interested');
      QIST.toast(QIST.t('opp.toast.noendpoint'));
    } else {
      btn.disabled = false; btn.textContent = QIST.t('opp.interested');
      QIST.toast(QIST.t('opp.toast.fail'));
    }
  });

  ['of-country','of-stage','of-myfield','of-type','of-field'].forEach(id => $(id).addEventListener('change', render));
  ['of-elig','of-open'].forEach(id => $(id).addEventListener('change', render));
  $('of-q').addEventListener('input', render);

  render();
})();
</script>
</body>
</html>
