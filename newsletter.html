<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="news.h2">The ScienceBridge AI digest · ScienceBridge AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%232447a8'/><text x='50' y='69' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'>Q</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2026-09-28c">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="banner girih-edge" style="background-image:url('assets/img/tiles-samarkand.jpg')">
  <div class="container">
    <div>
      <h1 data-i18n="news.h2"></h1>
      <p class="lede" data-i18n="news.lede"></p>
    </div>
  </div>
</section>

<div class="container" style="padding-top:32px">

  <div class="newsletter-cta">
    <h3 data-i18n="news.sub.h"></h3>
    <form id="subscribe-form" class="digest-form">
      <label class="sr-only" for="sub-email" data-i18n="common.email"></label>
      <input type="email" required data-i18n-attr="placeholder:home.cta.ph" id="sub-email">
      <button class="btn btn-primary" type="submit" data-i18n="home.cta.btn"></button>
    </form>
  </div>
  <p class="count-line" data-i18n="news.archive.note"></p>
  <div id="issues"></div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2026-09-28c"></script>
<script src="assets/js/app.js?v=2026-09-28c"></script>
<script>
(async () => {
  await QIST.boot('newsletter.html');
  const issues = await QIST.getNewsletter();

  document.getElementById('issues').innerHTML = issues.map(i => `
    <article class="issue">
      <div class="date">${QIST.t('news.issue', { n: i.number })} · ${QIST.esc(i.date)}</div>
      <h3>${QIST.esc(i.title)}</h3>
      ${i.sections.map(sec => `
        <h4>${QIST.esc(sec.heading)}</h4>
        <ul>${sec.items.map(it => `<li>${QIST.esc(it)}</li>`).join('')}</ul>`).join('')}
    </article>`).join('');

  /* Sign-up goes to the configured endpoint, like the home page. It used to write the address
     into the visitor's own localStorage and say "Subscribed!": nothing ever reached QIST. */
  const form = document.getElementById('subscribe-form');
  const input = document.getElementById('sub-email');
  const btn = form.querySelector('button');
  if (!QIST.SIGNUP_ENDPOINT) {
    input.disabled = true; btn.disabled = true;
    form.insertAdjacentHTML('afterend', `<p class="count-line">${QIST.t('home.cta.off')}</p>`);
  } else {
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const email = input.value.trim();
      if (!email) return;
      btn.disabled = true; btn.textContent = QIST.t('common.sending');
      const res = await QIST.submitForm(QIST.SIGNUP_ENDPOINT, {
        _subject: 'ScienceBridge digest sign-up', kind: 'pilot_signup', source: 'newsletter', email, at: new Date().toISOString()
      });
      if (res.ok) {
        form.outerHTML = `<p>${QIST.t('home.cta.ok')}</p>`;
      } else {
        btn.disabled = false; btn.textContent = QIST.t('home.cta.btn');
        QIST.toast(QIST.t('opp.toast.fail'));
      }
    });
  }
})();
</script>
</body>
</html>
